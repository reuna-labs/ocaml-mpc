# osv-scanner configuration for reuna-gate's deps step.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
reason = "atomic-polyfill is unmaintained (an informational advisory, no fix exists). It reaches test/interop/rust only through frost-core -> postcard -> heapless 0.7, and only on targets without native atomics; on the hosts the interop oracle runs on it is not compiled (cargo tree -i atomic-polyfill prints nothing without --target all). Revisit when frost-core moves to heapless 0.8."
